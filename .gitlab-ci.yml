stages:
  - test
  - build
  - smoke
# NOTE: No deploy stage - ArgoCD handles image updates automatically

variables:
  NODE_VERSION: "22"

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/frontend-smoke.yml'

# Type-check and unit tests. The smoke gate only proves the app renders without
# console errors, which a silently broken toolbar or a document model that never
# reads back its own writes passes cleanly.
test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  # `npm ci` on the in-cluster runner is the entire cost of this job — the tests
  # themselves run in about a second. The first run at 15 minutes timed out
  # inside the install with the job cache still empty ("Cache file does not
  # exist"), and because `build` needs this stage, that left an already-merged
  # fix unbuilt and undeployed. The cache populates after one green run, so the
  # generous ceiling is only needed once.
  timeout: 25 minutes
  variables:
    CI: "true"
    # A registry blip should retry rather than stall the whole install.
    NPM_CONFIG_FETCH_RETRIES: "5"
    NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
  before_script:
    # Auth must match the registry line in .npmrc by URI prefix or npm ignores it.
    - echo "//git.aegis-hq.xyz/api/v4/groups/9/-/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm ci --no-audit --no-fund --prefer-offline
  script:
    - npx tsc --noEmit
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"

build:
  extends: .kaniko-build
  stage: build
  variables:
    KANIKO_EXTRA_FLAGS: "--build-arg=NPM_TOKEN=${CI_JOB_TOKEN}"

# Smoke-test gate: load built image (with crypto.randomUUID polyfill) in real Chromium, fail on console errors / blank page
smoke-test:
  extends: .smoke-test
  needs: ["build"]
